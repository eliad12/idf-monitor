name: scan
on:
  schedule:
    - cron: "4-59/10 * * * *"   # off the top of the hour, when GitHub drops/delays most scheduled runs
  workflow_dispatch:
    inputs:
      window:
        description: "How far back to search (2d routine, 7d to backfill the week)"
        default: "2d"
permissions:
  contents: write
concurrency:
  group: scan
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography anthropic
      - run: python idf_monitor.py --selftest
      - run: python idf_monitor.py --once
        env:
          DATA_PASSWORD: ${{ secrets.DATA_PASSWORD }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}   # optional: powers the site's refresh button
          NEWS_WINDOW: ${{ inputs.window || '2d' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: tone tagging
          TONE_MODEL: ${{ vars.TONE_MODEL }}                    # optional: defaults to claude-haiku-5-5
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }} # optional: alert bot
      - name: Save results (encrypted only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.enc
          git diff --cached --quiet && exit 0
          git commit -m "Update mentions"
          git pull --rebase && git push
