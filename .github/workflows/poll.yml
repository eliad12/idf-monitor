name: scan
on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub often starts these 10-30 min late
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scan
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python idf_monitor.py --selftest
      - run: python idf_monitor.py --once
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mentions.json data.json
          git diff --cached --quiet && exit 0
          git commit -m "Update mentions"
          git pull --rebase && git push
