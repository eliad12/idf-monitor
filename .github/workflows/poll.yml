name: scan
on:
  schedule:
    - cron: "4-59/10 * * * *"   # GitHub runs these rarely on free repos; heartbeat.yml starts a scan every 10 min
  workflow_dispatch:
    inputs:
      window:
        description: "How far back to search (2d routine, 7d to backfill the week)"
        default: "2d"
  push:
    branches: [main]            # code changes go live right away
# The site is published straight from this job (Pages source = GitHub Actions), so the
# encrypted data never piles up in git history; each run continues from the live data files.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: scan
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography anthropic
      - run: python idf_monitor.py --selftest && PROFILE=hfc python idf_monitor.py --selftest
      # Every deploy replaces the whole site: both data files must come back, or their history is lost.
      - name: Continue from the data that is live now
        run: |
          for f in data.enc data_hfc.enc; do
            url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/$f?t=$(date +%s)"
            code=$(curl -sS -o "$f" -w '%{http_code}' "$url")
            if [ "$code" = 404 ]; then rm -f "$f"; echo "$f not published yet: starting fresh"
            elif [ "$code" != 200 ]; then echo "could not read live $f (HTTP $code); stopping so history is not overwritten"; exit 1; fi
          done
      - run: python idf_monitor.py --once
        env:
          DATA_PASSWORD: ${{ secrets.DATA_PASSWORD }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}   # optional: powers the site's refresh button
          NEWS_WINDOW: ${{ inputs.window || '2d' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: tone tagging
          TONE_MODEL: ${{ vars.TONE_MODEL }}                    # optional: defaults to claude-haiku-5-5
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }} # optional: alert bot
      # Home Front Command system: own data file and password, no Telegram bot. If it fails or HFC_PASSWORD
      # isn't set yet, the data_hfc.enc downloaded above is published unchanged.
      - name: Home Front Command scan
        continue-on-error: true
        run: PROFILE=hfc python idf_monitor.py --once
        env:
          HFC_PASSWORD: ${{ secrets.HFC_PASSWORD }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}   # refresh button only
          NEWS_WINDOW: ${{ inputs.window || '2d' }}
      - name: Build the site folder (encrypted data only)
        run: |
          mkdir site
          cp index.html sw.js manifest.webmanifest stories.js hub.js hub.css icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png data.enc site/
          if [ -f data_hfc.enc ]; then cp data_hfc.enc site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # deploy-pages sometimes can't see the just-uploaded artifact yet ("No artifacts named github-pages"): wait and retry once
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
